<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportsHub — Eventi sportivi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link rel="stylesheet" href="./assets/css/style.css">
  <script type="module" src="./assets/js/script.js"></script>
</head>

<body>

  <header class="site-header">
    <div class="container">

      <div class="header-azioni">
        <!-- tema chiaro/scuro, Accedi, Registrati: arrivano dopo la v1.0.0 -->
      </div>

      <h1 class="titolo">SportsHub</h1>
      <p class="sottotitolo">Cerca una squadra, scopri prossime partite e ultimi risultati.</p>

      <form id="form-ricerca" class="ricerca" role="search">
        <label for="query" class="visually-hidden">Nome squadra</label>

        <input type="search" id="query" name="query" class="form-control"
          placeholder="es. Arsenal, Lakers, Milan" autocomplete="off" required>

        <button type="submit" class="btn btn-light">Cerca</button>
      </form>

    </div>
  </header>

  <main class="container">

    <section id="risultati-section">

      <div id="spinner" class="spinner text-center" hidden>
        <span class="spinner-border" role="status" aria-hidden="true"></span>
        <p class="mt-2 mb-0">Caricamento in corso…</p>
      </div>

      <div id="errore" class="alert alert-danger" role="alert" hidden></div>

      <p id="stato-vuoto" class="stato-vuoto">Cerca una squadra per iniziare.</p>

      <h2 id="titolo-risultati" class="titolo-sezione" hidden>Squadre trovate</h2>

      <div id="risultati" class="griglia-squadre" aria-live="polite"></div>
    </section>

    <section id="dettagli-section" class="dettagli" hidden>
      <div class="dettagli-intestazione">
        <img id="dettagli-logo" class="dettagli-logo" alt="">

        <div>
          <h2 id="dettagli-nome" class="mb-0"></h2>
          <p id="dettagli-meta" class="meta mb-0"></p>
        </div>
      </div>

      <div class="dettagli-colonne">
        <div>
          <h3 class="titolo-lista">Prossimi eventi</h3>
          <ul id="prossimi" class="lista-eventi"></ul>
        </div>

        <div>
          <h3 class="titolo-lista">Ultimi risultati</h3>
          <ul id="ultimi" class="lista-eventi"></ul>
        </div>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js"
    integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq"
    crossorigin="anonymous"></script>
</body>

</html>
