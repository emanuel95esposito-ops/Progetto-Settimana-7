<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportsHub — Eventi sportivi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link rel="stylesheet" href="./assets/css/style.css">
  <script type="module" src="./assets/js/script.js"></script>
</head>

<body>

  <header class="bg-primary text-white text-center py-5">
    <div class="container">

      <div class="header-azioni">
        <!-- tema chiaro/scuro, Accedi, Registrati: arrivano dopo la v1.0.0 -->
      </div>

      <h1 class="display-4 fw-bold mb-2">SportsHub</h1>
      <p class="lead opacity-75 mb-4">Cerca una squadra, scopri prossime partite e ultimi risultati.</p>

      <form id="form-ricerca" class="row justify-content-center" role="search">
        <div class="col-12 col-md-8 col-lg-6">
          <label for="query" class="visually-hidden">Nome squadra</label>
          <div class="input-group input-group-lg">
            <input type="search" id="query" name="query" class="form-control" placeholder="es. Arsenal, Lakers, Milan"
              autocomplete="off" required>

            <button type="submit" class="btn btn-light fw-semibold">Cerca</button>
          </div>
        </div>
      </form>

    </div>
  </header>

  <main class="container">

    <section id="risultati-section">

      <div id="spinner" class="text-center text-body-secondary py-5" hidden>
        <span class="spinner-border" role="status" aria-hidden="true"></span>
        <p class="mt-2 mb-0">Caricamento in corso…</p>
      </div>

      <div id="errore" class="alert alert-danger" role="alert" hidden></div>

      <p id="stato-vuoto" class="text-center text-body-secondary fst-italic py-5 mb-0">Cerca una squadra per iniziare.
      </p>

      <h2 id="titolo-risultati" class="h5 fw-bold mb-3" hidden>Squadre trovate</h2>

      <div id="risultati" class="row g-3" aria-live="polite"></div>
    </section>

    <section id="dettagli-section" class="bg-white rounded shadow-sm p-4 mt-4" hidden>
      <div class="d-flex align-items-center gap-3 mb-4">
        <img id="dettagli-logo" class="object-fit-contain" width="72" height="72" alt="">

        <div>
          <h2 id="dettagli-nome" class="h4 text-primary mb-0"></h2>
          <p id="dettagli-meta" class="text-body-secondary small  mb-0"></p>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-md-6">
          <h3 class="h5 border-bottom border-2 border-primary pb-2">Prossimi eventi</h3>
          <ul id="prossimi" class="list-unstyled mb-0"></ul>
        </div>

        <div class="col-md-6">
          <h3 class="h5 border-bottom border-2 border-primary pb-2">Ultimi risultati</h3>
          <ul id="ultimi" class="list-unstyled mb-0"></ul>
        </div>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js"
    integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq"
    crossorigin="anonymous"></script>
</body>

</html>
