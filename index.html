<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportsHub — Eventi sportivi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link rel="stylesheet" href="./assets/css/style.css">
  <script type="module" src="./assets/js/script.js"></script>
</head>

<body>

  <header class="bg-primary text-white text-center py-5">
    <div class="container">

      <div class="header-azioni">
        <!-- tema chiaro/scuro, Accedi, Registrati: arrivano dopo la v1.0.0 -->
      </div>

      <h1 class="display-4 fw-bold mb-2">SportsHub</h1>
      <p class="lead opacity-75 mb-4">Cerca una squadra, scopri prossime partite e ultimi risultati.</p>

      <form id="form-ricerca" class="row justify-content-center" role="search">
        <div class="col-12 col-md-8 col-lg-6">
          <label for="query" class="visually-hidden">Nome squadra</label>
          <div class="input-group input-group-lg">
            <input type="search" id="query" name="query" class="form-control" placeholder="es. Arsenal, Lakers, Milan"
              autocomplete="off" required>

            <button type="submit" class="btn btn-light fw-semibold">Cerca</button>
          </div>
        </div>
      </form>

      <div id="esempi" class="d-flex justify-content-center flex-wrap gap-2 mt-3"></div>

    </div>
  </header>

  <main class="container">

    <section id="preferiti-section" class="mb-5">
      <h2 class="h5 fw-bold mb-3">&#9733; Le tue squadre preferite</h2>

      <div id="filtri-sport" class="btn-group btn-group-sm mb-3" role="group" aria-label="Filtra per sport" hidden>
        <button type="button" class="btn btn-primary" data-sport="tutti">Tutti</button>
        <button type="button" class="btn btn-outline-primary" data-sport="Soccer">Calcio</button>
        <button type="button" class="btn btn-outline-primary" data-sport="Basketball">Basket</button>
        <button type="button" class="btn btn-outline-primary" data-sport="American Football">Football</button>
      </div>

      <p id="preferiti-vuoto" class="text-body-secondary fst-italic mb-0">
        Non hai ancora salvato nessuna squadra. Cercane una e aggiungila ai preferiti.
      </p>

      <div id="preferiti" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3"></div>
    </section>

    <section id="risultati-section">

      <div id="spinner" class="text-center text-body-secondary py-5" hidden>
        <span class="spinner-border" role="status" aria-hidden="true"></span>
        <p class="mt-2 mb-0">Caricamento in corso…</p>
      </div>

      <div id="errore" class="alert alert-danger" role="alert" hidden></div>

      <div id="stato-vuoto" class="text-center text-body-secondary py-5"></div>

      <h2 id="titolo-risultati" class="h5 fw-bold mb-3" hidden>Squadre trovate</h2>

      <div id="risultati" class="row g-3" aria-live="polite"></div>
    </section>


  </main>

  <div class="modal fade" id="dettagli-modal" tabindex="-1" aria-labelledby="dettagli-nome" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">

        <div class="modal-header">
          <div class="d-flex align-items-center gap-3">
            <img id="dettagli-logo" class="object-fit-contain" width="56" height="56" alt="">

            <div>
              <h2 id="dettagli-nome" class="h5 text-primary mb-0"></h2>
              <p id="dettagli-meta" class="text-body-secondary small mb-0"></p>
            </div>
          </div>

          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
        </div>

        <div class="modal-body">
          <div class="row g-4">
            <div class="col-md-6">
              <h3 class="h6 border-bottom border-2 border-primary pb-2">Prossimi eventi</h3>
              <ul id="prossimi" class="list-unstyled mb-0"></ul>
            </div>

            <div class="col-md-6">
              <h3 class="h6 border-bottom border-2 border-primary pb-2">Ultimi risultati</h3>
              <ul id="ultimi" class="list-unstyled mb-0"></ul>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js"
    integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq"
    crossorigin="anonymous"></script>
</body>

</html>
